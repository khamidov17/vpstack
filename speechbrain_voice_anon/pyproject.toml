[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speechbrain-voice-anon"
version = "0.1.0.dev0"
description = "SpeechBrain recipes for VoicePrivacy 2026: B1 (McAdams), B2 (HuBERT + ECAPA + HiFi-GAN), and stronger starters. Re-implementation, not a fork."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "vpstack contributors" }]
keywords = ["voice-anonymization", "vp2026", "speechbrain", "speech-privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "speechbrain>=1.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "huggingface-hub>=0.20",
    "librosa>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/vpstack/vpstack"
Issues = "https://github.com/vpstack/vpstack/issues"

[tool.hatch.build.targets.wheel]
packages = ["speechbrain_voice_anon"]

[tool.ruff]
line-length = 100
target-version = "py310"
