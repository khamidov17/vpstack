[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpstack-mcp"
version = "0.1.0.dev0"
description = "MCP server exposing VP2026 voice-privacy tools to any MCP-aware AI agent."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "vpstack contributors" }]
keywords = ["voice-anonymization", "vp2026", "mcp", "speechbrain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "speechbrain-voice-anon",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.scripts]
vpstack-mcp = "vpstack_mcp.server:main"

[project.urls]
Homepage = "https://github.com/vpstack/vpstack"
Issues = "https://github.com/vpstack/vpstack/issues"

[tool.hatch.build.targets.wheel]
packages = ["vpstack_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"
