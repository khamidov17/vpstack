name: Release

# Tag-driven atomic release: bumping VERSION and pushing a v*.*.* tag
# publishes the npm package.
#
# Required secrets:
#   NPM_TOKEN             — npm automation token for vpstack package
#
# Tag format: v0.1.0, v0.1.1, v0.2.0-rc1, etc.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  verify-versions-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Verify tag matches VERSION file
        run: |
          TAG="${GITHUB_REF##*/v}"
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]' | sed 's/-dev//')
          if [ "$TAG" != "$FILE_VERSION" ]; then
            echo "FAIL: tag v$TAG does not match VERSION file ($FILE_VERSION)" >&2
            exit 1
          fi

      - name: Verify all package versions match
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          NPM_VERSION=$(node -p "require('./package.json').version")
          [ "$VERSION" = "$NPM_VERSION" ] || (echo "FAIL: versions out of sync. Bump both together."; exit 1)

  publish-npm:
    needs: verify-versions-match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: [publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            vpstack ${{ github.ref_name }}

            Package published:
            - npm: `vpstack@${{ github.ref_name }}`

            See [CHANGELOG.md](CHANGELOG.md) for details.
